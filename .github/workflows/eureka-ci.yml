name: Eureka CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'eureka/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'eureka/**'
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼 활성화

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 같은 브랜치에 새 푸시가 오면 진행 중인 실행 취소

jobs:
  build-test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eureka
    steps:
      - name: 체크아웃 # Repository 코드를 러너로 클론
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # ~/.m2 의존성 캐싱 -> 2회차부터 빌드 빨라짐

      - name: 빌드 및 테스트
        run: ./mvnw -B clean verify # clean -> compile -> test -> verify

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: eureka/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: 배포
    needs: build-test # 빌드·테스트 통과해야 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # main 직접 push에만 (PR 제외, PR Merge 시 push 트리거)
    runs-on: ubuntu-latest
    steps:
      - name: 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/msa-infra/eureka
            git pull origin main
            docker compose -f compose.yaml up -d --build
            docker image prune -f