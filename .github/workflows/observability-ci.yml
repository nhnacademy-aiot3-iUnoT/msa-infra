name: Observability CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'observability/**'
  workflow_dispatch:

jobs:
  deploy:
    name: 배포
    runs-on: ubuntu-latest
    steps:
      - name: 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/msa-infra
            ./observability/deploy/observability-cd.sh

