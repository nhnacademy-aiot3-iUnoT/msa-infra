filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      templates:
        - condition:
            contains:
              docker.container.name: team1
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log

processors:
  - dissect:
      tokenizer: "%{log_timestamp} %{log_level->} %{pid} --- [%{app_name}] [%{thread}] %{logger} : %{log_message}"
      field: "message"
      target_prefix: ""
      ignore_failure: true
  - drop_fields:
      fields:
        - "docker.container.labels.org_opencontainers_image_description"
        - "docker.container.labels.org_opencontainers_image_title"
        - "docker.container.labels.org_opencontainers_image_version"
        - "docker.container.labels.org_opencontainers_image_created"
      ignore_missing: true

output.elasticsearch:
  hosts: ["${ES_HOST}"]
  username: "${ES_USER}"
  password: "${ES_PASSWORD}"
  index: "team1-logs-%{+yyyy.MM.dd}"

setup.template.name: "team1-logs"
setup.template.pattern: "team1-logs-*"
setup.template.settings:
  index.lifecycle.name: "team1-logs-policy"   # 30일 지난 인덱스 자동 삭제 (ilm-setup.sh로 사전 등록 필요)
setup.ilm.enabled: false

logging.level: info
logging.to_stderr: true