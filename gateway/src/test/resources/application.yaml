management:
  tracing:
    export:
      enabled: false

services:
  url:
    account: http://localhost:10413
    rule-engine: http://localhost:10406
    inventory: http://localhost:10411

security:
  jwt:
    public-paths:
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/refresh
      - /api/auth/.well-known/jwks.json
      - /api/accounts
      - /api/accounts/check-email
      - /api/accounts/check-pwd
      - /api/accounts/pwd/**
      - /api/core/invitations/**


eureka:
  client:
    enabled: false

