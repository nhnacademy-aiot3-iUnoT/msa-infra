name: Observability CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'observability/**'
  workflow_dispatch:

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: true # 같은 브랜치에 새 푸시가 오면 진행 중인 실행 취소

jobs:
  deploy:
    name: 배포
    runs-on: ubuntu-latest
    steps:
      - name: 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/msa-infra
            ./observability/deploy/observability-cd.sh

