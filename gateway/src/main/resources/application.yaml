spring:
  application:
    name: team1-gateway

server:
  port: ${SERVER_PORT:10401}
eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: >-
        http://team1-eureka-1:10402/eureka/,
        http://team1-eureka-2:10404/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, service-registry
  endpoint:
    health:
      show-details: never